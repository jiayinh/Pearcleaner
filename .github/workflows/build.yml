name: Build PearBrew

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26 (pinned to a stable version)
        run: |
          echo "Available Xcode versions:"
          ls /Applications | grep -i Xcode || true
          # Prefer a known-good Xcode 26.0, fall back to lowest 26.x, then any 26.x
          if [ -d /Applications/Xcode_26.0.app ]; then
            XCODE_APP=/Applications/Xcode_26.0.app
          else
            XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | head -n 1)
          fi
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=/Applications/Xcode.app
          fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -switch "$XCODE_APP/Contents/Developer"

      - name: Show versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i macos || true
          swift --version

      - name: List schemes
        run: xcodebuild -list -project Pearcleaner.xcodeproj

      - name: Build (unsigned)
        run: |
          set +e
          xcodebuild clean build \
            -project Pearcleaner.xcodeproj \
            -scheme "Pearcleaner Release" \
            -configuration Release \
            -derivedDataPath build \
            -destination "generic/platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_HARDENED_RUNTIME=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation 2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            echo "::group::Build failure summary"
            grep -nE "error:|fatal error|Command SwiftCompile failed" xcodebuild.log | tail -200 || true
            echo "::endgroup::"
            exit "$status"
          fi

      - name: Zip app
        run: |
          APP_PATH=$(find build/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" PearBrew.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PearBrew-app
          path: PearBrew.zip
          if-no-files-found: error
