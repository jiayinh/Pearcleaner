name: Build PearBrew

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          echo "Available Xcode versions:"
          ls /Applications | grep -i Xcode || true
          if [ -d /Applications/Xcode_16.4.app ]; then
            XCODE_APP=/Applications/Xcode_16.4.app
          else
            XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -z "$XCODE_APP" ]; then
            echo "Xcode 16 is not available on this runner."
            exit 1
          fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -switch "$XCODE_APP/Contents/Developer"

      - name: Show versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i macos || true
          swift --version

      - name: List schemes
        run: xcodebuild -list -project Pearcleaner.xcodeproj

      - name: Build (unsigned)
        run: |
          set +e
          xcodebuild -quiet clean build \
            -project Pearcleaner.xcodeproj \
            -scheme "Pearcleaner Release" \
            -configuration Release \
            -derivedDataPath build \
            -destination "generic/platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_HARDENED_RUNTIME=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation 2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            echo "::group::Build failure summary"
            grep -nE "error:|fatal error|Command SwiftCompile failed" xcodebuild.log | tail -200 || true
            echo "::endgroup::"
            exit "$status"
          fi

      - name: Add app icon
        run: |
          APP_PATH=$(find build/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          ICON_SRC="Pearcleaner/Resources/Glass.icon/Assets/pear.heic"
          ICONSET="$RUNNER_TEMP/PearBrew.iconset"
          PNG_SRC="$RUNNER_TEMP/PearBrew-icon.png"
          ICNS_PATH="$RUNNER_TEMP/PearBrew.icns"

          echo "Preparing app icon for: $APP_PATH"
          test -d "$APP_PATH"
          test -f "$ICON_SRC"

          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"
          sips -s format png "$ICON_SRC" --out "$PNG_SRC"

          sips -z 16 16     "$PNG_SRC" --out "$ICONSET/icon_16x16.png"
          sips -z 32 32     "$PNG_SRC" --out "$ICONSET/icon_16x16@2x.png"
          sips -z 32 32     "$PNG_SRC" --out "$ICONSET/icon_32x32.png"
          sips -z 64 64     "$PNG_SRC" --out "$ICONSET/icon_32x32@2x.png"
          sips -z 128 128   "$PNG_SRC" --out "$ICONSET/icon_128x128.png"
          sips -z 256 256   "$PNG_SRC" --out "$ICONSET/icon_128x128@2x.png"
          sips -z 256 256   "$PNG_SRC" --out "$ICONSET/icon_256x256.png"
          sips -z 512 512   "$PNG_SRC" --out "$ICONSET/icon_256x256@2x.png"
          sips -z 512 512   "$PNG_SRC" --out "$ICONSET/icon_512x512.png"
          sips -z 1024 1024 "$PNG_SRC" --out "$ICONSET/icon_512x512@2x.png"

          iconutil -c icns "$ICONSET" -o "$ICNS_PATH"
          cp "$ICNS_PATH" "$APP_PATH/Contents/Resources/PearBrew.icns"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile PearBrew" "$APP_PATH/Contents/Info.plist" ||             /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string PearBrew" "$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconName PearBrew" "$APP_PATH/Contents/Info.plist" ||             /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string PearBrew" "$APP_PATH/Contents/Info.plist"
          ls -lh "$APP_PATH/Contents/Resources/PearBrew.icns"

      - name: Zip app
        run: |
          APP_PATH=$(find build/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" PearBrew.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PearBrew-app
          path: PearBrew.zip
          if-no-files-found: error
