name: Build Pearcleaner

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode (needs macOS 26 SDK)
        run: |
          echo "Available Xcode versions:"
          ls /Applications | grep -i Xcode || true
          # Pick the highest-numbered Xcode_26* if present, else newest available
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=/Applications/Xcode.app
          fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -switch "$XCODE_APP/Contents/Developer"

      - name: Show versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i macos || true
          swift --version

      - name: List schemes
        run: xcodebuild -list -project Pearcleaner.xcodeproj

      - name: Build (unsigned)
        run: |
          xcodebuild clean build \
            -project Pearcleaner.xcodeproj \
            -scheme "Pearcleaner Release" \
            -configuration Release \
            -derivedDataPath build \
            -destination "generic/platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_HARDENED_RUNTIME=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation

      - name: Zip app
        run: |
          APP_PATH=$(find build/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" Pearcleaner.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pearcleaner-app
          path: Pearcleaner.zip
          if-no-files-found: error
